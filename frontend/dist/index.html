  <body class="bg-stone-50 text-stone-900 transition-colors duration-200">
    <script>
      // Login required: no/invalid token -> /login
      (function () {
        var t = null;
        try { t = localStorage.getItem('arogya_token'); } catch (e) {}
        if (!t) { location.replace('/login'); return; }
        fetch('/api/auth/me', { headers: { Authorization: 'Bearer ' + t } })
          .then(function (r) {
            if (r.status === 401) { try { localStorage.removeItem('arogya_token'); } catch (e) {} location.replace('/login'); }
          }).catch(function () {});
      })();
    </script>
    <div id="root"></div>
  </body>
